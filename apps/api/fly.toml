# HOP API on Fly.io. No secrets in this file.
# Persistent SQLite is NOT supported (ephemeral machine disk).
# Postgres + Redis + Alembic: docs/FLY_DEPLOYMENT.md
#
# After `fly apps create`, set `app` and [env] API_PUBLIC_URL / CORS_ORIGINS
# to https://<your-app>.fly.dev (restrictive HTTPS allow-list, not *).

app = "hop-api"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  APP_VERSION = "0.1.0"
  DOCS_ENABLED = "false"
  LOG_LEVEL = "INFO"
  LOG_FORMAT = "json"
  TRUST_PROXY_HEADERS = "true"
  UVICORN_WORKERS = "2"
  FORWARDED_ALLOW_IPS = "*"
  METRICS_ENABLED = "true"
  API_PUBLIC_URL = "https://hop-api.fly.dev"
  CORS_ORIGINS = "https://hop-api.fly.dev"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
