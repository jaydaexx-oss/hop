# fly.toml app configuration file generated for hop-uokqmg on 2026-08-17T01:42:14Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'hop-uokqmg'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[env]
  API_PUBLIC_URL = 'https://hop-api.fly.dev'
  APP_ENV = 'production'
  APP_VERSION = '0.1.0'
  CORS_ORIGINS = 'https://hop-api.fly.dev'
  DOCS_ENABLED = 'false'
  FORWARDED_ALLOW_IPS = '*'
  LOG_FORMAT = 'json'
  LOG_LEVEL = 'INFO'
  METRICS_ENABLED = 'true'
  TRUST_PROXY_HEADERS = 'true'
  UVICORN_WORKERS = '2'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '1m0s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
