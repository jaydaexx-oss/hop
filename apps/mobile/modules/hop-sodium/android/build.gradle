plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.hop.sodium'
version = '0.1.0'

def reactNativeArchitectures() {
  def value = project.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

android {
  namespace "app.hop.sodium"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    externalNativeBuild {
      cmake {
        abiFilters (*reactNativeArchitectures())
        arguments "-DANDROID_STL=c++_shared",
          "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
      }
    }
  }
  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }
  buildFeatures {
    prefab true
  }
  lintOptions {
    abortOnError false
  }
}

tasks.register("fetchLibsodium", Exec) {
  commandLine "sh", "${projectDir}/../scripts/fetch-libsodium.sh"
}

preBuild.dependsOn fetchLibsodium
